version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # Hold TypeScript on 6.x: typescript-eslint refuses to load against the
      # TS 7 API and fails the `quality` job. Drop this once typescript-eslint
      # ships TS >=7.1 support (typescript-eslint/typescript-eslint#10940).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep @types/node on its current major; bump majors deliberately.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Hold the test SDK on the OpenTelemetry JS 2.x line. 2.x
      # (@opentelemetry/sdk-trace-base) caps its peer at api <1.10.0, while the
      # 3.x packages require api >=1.10.0 and move tracing to the separate
      # @opentelemetry/sdk-trace package, so the lines cannot be mixed. Moving
      # to 3.x is a deliberate migration of all of these together.
      - dependency-name: '@opentelemetry/api'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@opentelemetry/sdk-metrics'
        update-types: ['version-update:semver-major']
      - dependency-name: '@opentelemetry/context-async-hooks'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
