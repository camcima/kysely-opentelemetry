version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # Hold TypeScript on 6.x: typescript-eslint refuses to load against the
      # TS 7 API and fails the `quality` job. Drop this once typescript-eslint
      # ships TS >=7.1 support (typescript-eslint/typescript-eslint#10940).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep @types/node on its current major; bump majors deliberately.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Hold @opentelemetry/api on 1.9.x: @opentelemetry/sdk-trace-base 2.x
      # (still the latest; no 3.x yet) caps its peer at api <1.10.0. Drop this
      # once sdk-trace-base ships a release that accepts api 1.10.
      - dependency-name: '@opentelemetry/api'
        update-types: ['version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
