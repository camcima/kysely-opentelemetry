# Grafana + Tempo + Prometheus + OTel Collector (all-in-one) and a Postgres.
# Ports can be overridden when the defaults are taken:
#   GRAFANA_PORT=3300 POSTGRES_PORT=55432 docker compose up -d
services:
  lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
      - '${OTLP_GRPC_PORT:-4317}:4317'
      - '${OTLP_HTTP_PORT:-4318}:4318'
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/kysely.yaml:ro
      - ./grafana/kysely-dashboard.json:/otel-lgtm/kysely-dashboard.json:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
